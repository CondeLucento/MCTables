name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5  # Actualizado a v5
      with:
        python-version: "3.10"       # Usamos una sola versión estable para ir más rápido
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        # Si usas otras librerías, instálalas aquí
        
    - name: Analysing the code with pylint
      run: |
        # Usamos el archivo .pylintrc que creamos antes
        pylint --rcfile=.pylintrc $(git ls-files '*.py')
